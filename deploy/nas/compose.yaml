# Orapa sur le NAS : https://orapa.eriphe.com
# Public via le tunnel Cloudflare (réseau tunnel, aucun port publié), à la maison et par Tailscale via Traefik.
# Image publiée sur ghcr par l'action « Image Docker » à chaque push sur main.
# Mise à jour : docker compose pull puis up -d (ou « Update stack » dans Unraid).
name: orapa
services:
  orapa:
    image: ghcr.io/alexis-marcel/orapa:latest
    container_name: orapa
    restart: unless-stopped
    networks:
      default: {}
      tunnel: { aliases: [orapa] }   # le tunnel Cloudflare y joint l'app par son nom
    environment:
      AUTH_MODE: oidc
      ACCOUNT_NAME: Eriphe
      PORTAL_URL: https://eriphe.com
      PORTAL_NAME: Eriphe
      PORTAL_ICON: https://eriphe.com/favicon.svg
      PROFILE_URL: https://eriphe.com/profil
      OIDC_ISSUER: https://auth.eriphe.com/application/o/orapa/
      OIDC_CLIENT_ID: orapa
      ALLOWED_ORIGINS: orapa.eriphe.com
    volumes:
      - /mnt/user/appdata/orapa/data:/data   # orapa.db (SQLite), propriétaire 65532
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    labels:
      traefik.enable: "true"
      traefik.docker.network: orapa_default
      traefik.http.routers.orapa.rule: Host(`orapa.eriphe.com`)
      traefik.http.services.orapa.loadbalancer.server.port: "8080"

networks:
  tunnel:
    external: true   # partagé avec cloudflared : docker network create tunnel
